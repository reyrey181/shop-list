<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Shopping List</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shopping">
<meta name="theme-color" content="#2f6f4f">
<!-- Built by the meal bot (kidkare-bot/shop_page.py). The menu is in menu.enc,
     encrypted; the key is in the link after "#k=". -->
<style>
:root {
  color-scheme: light dark; /* native controls (the settings checkbox) follow the theme */
  --bg: #f6f6f3; --card: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e3e3de;
  --accent: #2f6f4f; --accent-ink: #ffffff; --done: #a3a39d; --star: #b07d00; --chip: #ecf3ef;
  --snack-btn: #8fd1ae; --track: #d3d3cd; --seg-on: #ffffff; --tag-bg: #fbe4ee; --tag-ink: #a3365f;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121412; --card: #1d201d; --ink: #ecece8; --muted: #9a9d97; --line: #2e322e;
          --accent: #5fae86; --accent-ink: #0d1a12; --done: #62665f; --star: #e3b341; --chip: #1f2b24;
          --snack-btn: #2f6f4f; --track: #3c413c; --seg-on: #3c413c; --tag-bg: #3a2230; --tag-ink: #f29cc0; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; border-bottom: 1px solid var(--line); }
.top, .tabs { max-width: 688px; margin-left: auto; margin-right: auto; }
.top { display: flex; align-items: center; gap: 8px; }
.top h1 { flex: 1; margin: 0; font-size: 19px; text-align: center; }
.top small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
.nav { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--card);
  color: var(--ink); font-size: 22px; cursor: pointer; }
.tabs { display: flex; gap: 6px; margin-top: 10px; }
.tabs button, .opt { flex: 1; min-height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font-size: 15px; cursor: pointer; }
.tabs button[aria-pressed="true"], .opt[aria-pressed="true"], .opt.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tabs .cog { flex: 0 0 44px; display: grid; place-items: center; padding: 0; }
.cog svg { width: 22px; height: 22px; }
/* Until the menu is open (no key, load error) the arrows and tabs do nothing. */
body:not(.ready) .nav { visibility: hidden; }
body:not(.ready) .tabs { display: none; }
.opt.primary { display: block; width: 100%; min-height: 48px; margin-top: 10px; font-weight: 600; }
main { padding: 12px 16px calc(env(safe-area-inset-bottom) + 40px); max-width: 720px; margin: 0 auto; }
.bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.bar .opt { flex: 0 1 auto; padding: 0 12px; }
h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 6px 8px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.box { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); display: grid; place-items: center; }
.row.done .box { background: var(--accent); border-color: var(--accent); }
.row.done .box::after { content: ""; width: 7px; height: 13px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.what { flex: 1; min-width: 0; }
.name { overflow-wrap: anywhere; }
.days { font-size: 13px; color: var(--muted); }
.row.done .name { color: var(--done); text-decoration: line-through; }
.star { color: var(--star); }
.more { flex: none; width: 44px; height: 44px; border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
.note { color: var(--muted); font-size: 14px; margin: 10px 4px; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.meal { padding: 10px 14px; border-top: 1px solid var(--line); }
.meal:first-child { border-top: 0; }
.meal b { display: block; font-size: 14px; color: var(--muted); font-weight: 600; }
.prep { background: var(--chip); border-radius: 12px; padding: 10px 14px; margin: 10px 0; font-size: 15px; }
.hidden-note { display: flex; align-items: center; gap: 10px; }
.hidden-note .opt { flex: none; margin-left: auto; padding: 0 14px; }
.daycard { margin-bottom: 12px; }
.daycard h3 { margin: 0; padding: 10px 14px; font-size: 16px; border-bottom: 1px solid var(--line); }
#sheet { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
#sheet[hidden] { display: none; }
.panel { background: var(--card); width: 100%; max-height: 80vh; overflow: auto; border-radius: 18px 18px 0 0;
  padding: 0 16px calc(env(safe-area-inset-bottom) + 16px); }
.panel h3 { margin: 0 0 6px; }
.panel h4 { margin: 16px 0 0; font-size: 15px; }
.panel > b { display: block; margin-top: 18px; }
.panel > h4 + .setting { border-top: 0; }
.setting select { flex: none; min-height: 40px; max-width: 48%; font-size: 15px; padding: 0 8px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.setting.aisle { margin-top: 10px; }
#progress { max-width: 688px; margin: 10px auto 0; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
#progress[hidden] { display: none; }
#progress .track { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
#progress .fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .25s; }
#progress.done { color: var(--accent); font-weight: 600; }
/* Settings: grey sheet, white cards, like a phone's own settings. */
.panel.grouped, .panel.grouped .sheet-head { background: var(--bg); }
.cap { margin: 18px 4px 8px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.foot { margin: 8px 4px 4px; font-size: 13px; color: var(--muted); }
.views { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.view { position: relative; display: flex; flex-direction: column; gap: 4px; min-height: 108px; padding: 14px;
  border: 2px solid var(--line); border-radius: 16px; background: var(--card); cursor: pointer; transition: border-color .15s, background .15s; }
.view input { position: absolute; opacity: 0; pointer-events: none; }
.view svg { width: 26px; height: 26px; margin-bottom: 6px; color: var(--muted); }
.view b { font-size: 16px; }
.view small { font-size: 13px; line-height: 1.3; color: var(--muted); }
.view.on { border-color: var(--accent); background: var(--chip); }
.view.on svg { color: var(--accent); }
.view.on::after { content: "✓"; position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 11px;
  display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; }
.view:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.group { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.opt-row { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 10px 14px; cursor: pointer; }
.opt-row + .opt-row { border-top: 1px solid var(--line); }
.ico { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; }
.ico svg { width: 18px; height: 18px; }
.opt-row .txt { flex: 1; min-width: 0; }
.opt-row small { display: block; margin-top: 1px; font-size: 13px; color: var(--muted); }
/* On/off switch (a checkbox underneath, so it still works with a keyboard and screen reader). */
.switch { -webkit-appearance: none; appearance: none; flex: none; position: relative; width: 51px; height: 31px; margin: 0;
  border-radius: 16px; background: var(--track); cursor: pointer; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .2s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(20px); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body.compact .row { min-height: 46px; padding-top: 4px; padding-bottom: 4px; }
/* Title and ✕ stay at the top however long the sheet is. */
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px;
  background: var(--card); padding: 12px 0 8px; }
.sheet-head h3 { flex: 1; margin: 0; }
.x { flex: none; width: 44px; height: 44px; border: 0; border-radius: 22px; background: var(--chip);
  color: var(--ink); font-size: 18px; cursor: pointer; }
.setting { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.setting span { flex: 1; }
.setting small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.setting input { flex: none; width: 26px; height: 26px; accent-color: var(--accent); }
#snack { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 20;
  max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 52px;
  padding: 6px 6px 6px 16px; border-radius: 12px; background: var(--ink); color: var(--bg);
  box-shadow: 0 4px 16px rgba(0,0,0,.25); font-size: 15px; }
#snack[hidden] { display: none; }
#snack button { margin-left: auto; flex: none; min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px;
  background: none; color: var(--snack-btn); font-size: 15px; font-weight: 700; cursor: pointer; }
.panel ul { padding-left: 20px; margin: 8px 0; }
.panel li { padding: 4px 0; }
.panel .opt { width: 100%; margin-top: 10px; }
#qr { display: grid; place-items: center; padding: 12px; background: #fff; border-radius: 12px; margin-top: 10px; }
/* Week switch: a segmented control, so it reads as a choice, not an action. */
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--line); }
.seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: var(--ink); font-size: 15px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--seg-on); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.bar { align-items: center; }
.bar .add { margin-left: auto; flex: 0 0 auto; padding: 0 14px; }
/* Sections: count of what's bought; a finished one folds to one line. */
h2 { display: flex; align-items: center; gap: 8px; }
h2 .cnt { margin-left: auto; letter-spacing: 0; }
h2 .hide { padding: 2px 8px; border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; }
.card.fold { display: flex; width: 100%; align-items: center; gap: 10px; padding: 14px; font: inherit; font-size: 15px;
  color: var(--muted); text-align: left; cursor: pointer; }
.card.fold::before { content: "✓"; color: var(--accent); font-weight: 700; }
.card.fold span { margin-left: auto; color: var(--accent); font-weight: 600; }
.tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 8px; vertical-align: 2px;
  background: var(--tag-bg); color: var(--tag-ink); font-size: 12px; font-weight: 600; }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row.pop .box { animation: pop .28s ease-out; }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .row.pop .box, #progress .fill { animation: none; transition: none; } }
body.compact .row .when { display: none; }
.notice { display: flex; align-items: center; gap: 10px; }
.notice .opt { flex: none; margin-left: auto; padding: 0 14px; }
.daycard.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.chip { margin-left: 8px; padding: 2px 8px; border-radius: 8px; vertical-align: 2px; background: var(--accent);
  color: var(--accent-ink); font-size: 12px; font-weight: 600; }
.field { width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink); font-size: 16px; }
.add-form { display: flex; gap: 8px; margin-top: 10px; }
.add-form .opt.primary { flex: none; width: auto; margin-top: 0; padding: 0 20px; }
#title { cursor: pointer; }
/* Bottom tab bar (List, Menu, Settings). Added in a commit of its own so it
   can be reverted alone if the old tabs at the top are wanted back. */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center;
  padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px); background: var(--card); border-top: 1px solid var(--line); }
.tabbar button { flex: 1; max-width: 160px; min-height: 52px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; border: 0; border-radius: 10px; background: none; color: var(--muted);
  font-size: 12px; font-weight: 600; cursor: pointer; }
.tabbar svg { width: 24px; height: 24px; }
.tabbar button[aria-pressed="true"] { color: var(--accent); }
body:not(.ready) .tabbar { display: none; }
main { padding-bottom: calc(env(safe-area-inset-bottom) + 100px); }
#snack { bottom: calc(env(safe-area-inset-bottom) + 80px); }
.top .nav { width: 40px; height: 40px; }
/* Tablets and PCs: two columns of sections and of days. Phones held upright
   are always under 760px, so they stay one column. */
@media (min-width: 760px) {
  main { max-width: 1060px; }
  .top, .tabs, #progress { max-width: 1028px; }
  .sections { columns: 2; column-gap: 20px; }
  .sec { display: inline-block; width: 100%; break-inside: avoid; }
  .daygrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .daygrid .daycard { margin: 0; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="nav" id="prev" aria-label="Previous week">‹</button>
    <h1 id="title">Shopping List</h1>
    <button class="nav" id="next" aria-label="Next week">›</button>
  </div>
  <div id="progress" hidden></div>
</header>
<main id="app"><p class="empty">Loading…</p></main>
<!-- Bottom tab bar, like a phone app (thumb-reach, and the top stays short). -->
<nav class="tabbar" aria-label="Pages">
  <button id="tab-list" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg><span>List</span></button>
  <button id="tab-menu" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><span>Menu</span></button>
  <button id="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path
      d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
</nav>
<div id="sheet" hidden><div class="panel" id="panel"></div></div>
<div id="snack" role="status" hidden></div>
<script>
'use strict';
const MEALS = ['Breakfast', 'Lunch', 'PM Snack'];
const GROUPS = [['milk', 'Milk'], ['meat', 'Meat & protein'], ['bread', 'Bread & grains'], ['fruit', 'Fruit'], ['vegetable', 'Vegetables']];
const MILK_LABEL = 'Milk - whole for under 2, 1% or skim for 2 and up';
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
let DATA = null;
const state = { tab: 'list', monday: null, twoWeeks: false, infants: true, sinkTicked: false, groupBy: 'type', compact: false,
  open: new Set(),    // finished sections opened again (this visit only)
  justTicked: null,   // the row to animate on this render
  offline: false };   // showing the phone's saved copy (sw.js X-Shop-Saved)

// ---------- storage (may be unavailable: private mode etc.) ----------
function load(k, fallback) { try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------- decryption: matches encrypt() in shop_page.py ----------
const te = new TextEncoder();
function b64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bin = atob(s), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
const hkey = raw => crypto.subtle.importKey('raw', raw, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
const mac = async (key, data) => new Uint8Array(await crypto.subtle.sign('HMAC', key, data));
async function decrypt(blob, master) {
  const mk = await hkey(master);
  const encKey = await hkey(await mac(mk, te.encode('shop-list enc')));
  const macKey = await hkey(await mac(mk, te.encode('shop-list mac')));
  const nonce = b64(blob.nonce), ct = b64(blob.ct), tag = b64(blob.tag);
  const signed = new Uint8Array(nonce.length + ct.length); signed.set(nonce); signed.set(ct, nonce.length);
  const want = await mac(macKey, signed);
  if (want.length !== tag.length || want.some((b, i) => b !== tag[i])) throw new Error('key');
  const jobs = [];
  for (let i = 0; i < Math.ceil(ct.length / 32); i++) {
    const m = new Uint8Array(nonce.length + 4); m.set(nonce); new DataView(m.buffer).setUint32(nonce.length, i); jobs.push(mac(encKey, m));
  }
  const ks = await Promise.all(jobs), out = new Uint8Array(ct.length);
  for (let i = 0; i < ct.length; i++) out[i] = ct[i] ^ ks[i >> 5][i & 31];
  return JSON.parse(new TextDecoder().decode(out));
}

// ---------- dates: the cycle rule from menu_cycle.month_day_index ----------
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const isWeekday = d => d.getDay() !== 0 && d.getDay() !== 6;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function monthDayIndex(d) {
  if (!isWeekday(d)) return null;
  let n = 0;
  for (let x = new Date(d.getFullYear(), d.getMonth(), 1); x < d; x = addDays(x, 1)) if (isWeekday(x)) n++;
  return n;
}
// A month already made (shop_page.made_months) is used as it is - that's what
// KidKare gets, closures included; the cycle only fills months not made yet.
const isClosed = d => (DATA.closed || []).includes(ymd(d));
function cycleDay(d) {
  if (!isWeekday(d) || isClosed(d)) return null;
  const made = (DATA.dated || {})[ymd(d)];
  if (made) return made;
  return DATA.days[monthDayIndex(d) % DATA.days.length];
}
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
function today() { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
// Fri/Sat/Sun shop for the coming week; Mon-Thu for this one.
function defaultMonday(t) { const m = mondayOf(t); return [5, 6, 0].includes(t.getDay()) ? addDays(m, 7) : m; }
function weekDates(monday, weeks) { const out = []; for (let w = 0; w < weeks; w++) for (let i = 0; i < 5; i++) out.push(addDays(monday, 7 * w + i)); return out; }

// ---------- the list (same rules as shopping_list.weekly_items, plus extras) ----------
// Every food once, then the extras (shop_page.meal_extras: ketchup for the hot
// dogs etc.), then foods only the infants get.
function weekItems(dates) {
  const big = new Map(), extras = new Map(), infant = new Map();
  const add = (map, name, d, meal, comp, wg) => {
    const k = name.toLowerCase();
    const e = map.get(k) || { name, key: k, dates: [], meals: new Set(), mealDates: {}, forFoods: new Set(), comp, wg: false };
    if (!e.dates.some(x => +x === +d)) e.dates.push(d);

      const it = day.infant[meal] || {};

// ---------- views: how the list is grouped (⚙ → Group the list by) ----------
const TYPE_GROUPS = [...GROUPS, ['extra', 'Extras']];

const AISLES = ['Produce', 'Bread & bakery', 'Meat & deli', 'Dairy & eggs', 'Pantry & snacks', 'Frozen', 'Baby'];
const AISLE_FALLBACK = { milk: 'Dairy & eggs', meat: 'Meat & deli', bread: 'Pantry & snacks', fruit: 'Produce', vegetable: 'Produce' };
// The page's guess (from shop_page.aisle_for: Baby is only real baby food),
// unless the shopper moved it.
const guessAisle = e => (DATA.aisles || {})[e.key] || AISLE_FALLBACK[e.comp] || 'Pantry & snacks';

function groupItems(items, mode) {
  if (mode === 'az') return items.length ? [['All items', items]] : [];
  const by = new Map(), put = (h, e) => { if (!by.has(h)) by.set(h, []); by.get(h).push(e); };
  if (mode === 'day') {
    for (const e of items) put(ymd(firstDate(e)), e);
    return [...by.keys()].sort().map(k => { const d = firstDate(by.get(k)[0]); return [`${DAY[d.getDay()]} ${fmt(d)}`, by.get(k)]; });
  }
  const moved = load('aisles', {});
  for (const e of items) {
    put(mode === 'aisle' ? aisleOf(e, moved) : e.infant ? 'Infants only' : TYPE_GROUPS.find(([c]) => c === e.comp)[1], e);
  }
  // Infants before Extras: the infants' food matters more than the ketchup.
  const order = mode === 'aisle' ? AISLES : [...GROUPS.map(([, h]) => h), 'Infants only', 'Extras'];

  const diff = Math.round((monday - mondayOf(today())) / 864e5 / 7);

// The shopper's own items (wipes, paper towels): kept on this phone until

  dates: [], mealDates: {}, forFoods: new Set() }));

// "Menu changed since you last looked": what this phone saw for this week

function copyList(groups, isDone, have) {
  const lines = [];
  for (const [h, items] of groups) {
    const rest = items.filter(e => !isDone(e) && (e.own || !have.has(e.key)));
    if (rest.length) { lines.push(h.toUpperCase()); rest.forEach(e => lines.push(e.name + (e.wg ? ' ★' : ''))); lines.push(''); }
  }
  const text = lines.join('\n').trim();
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
    () => snack('Copied. Paste into Reminders to get one checkbox per line.'),
    () => snack('Could not copy on this phone.'));
}

const PREP_SKIP = /cheese|peanut|egg|yogurt|bean|tuna/i;
const needsPrep = (c, n) => n && (/frozen/i.test(n) || (c === 'meat' && !PREP_SKIP.test(n)));
function renderMenu(weeks) {
  const parts = [...notices()];
  const t = today();
  // The next day the center serves: skips weekends and closed days.
  let next = addDays(t, 1), nextDay = cycleDay(next);
  for (let i = 0; !nextDay && i < 31; i++) { next = addDays(next, 1); nextDay = cycleDay(next); }
  if (nextDay) {
    const prep = [], seen = new Set();
    for (const meal of MEALS) {
      const it = nextDay.meals[meal] || {};
      for (const c of ['meat', 'bread', 'fruit', 'vegetable']) {
        if (needsPrep(c, it[c])) { prep.push(`${it[c]} (${meal})`); seen.add(it[c].toLowerCase()); }
      }
    }
    if (state.infants && nextDay.infant) for (const meal of MEALS) {
      const it = nextDay.infant[meal] || {};
      for (const c of ['meat', 'bread', 'fruit', 'vegetable']) {
        if (needsPrep(c, it[c]) && !seen.has(it[c].toLowerCase())) prep.push(`${it[c]} (Infants, ${meal})`);
      }
    }
    parts.push(el('div', { class: 'prep' }, el('b', {}, `Next up, ${DAY[next.getDay()]} ${next.getMonth() + 1}/${next.getDate()}: `),
      prep.length ? 'check you have these, and thaw any that need it - ' + prep.join(', ') + '.' : 'nothing to thaw.'));
  }
  const grid = el('div', { class: 'daygrid' });
  parts.push(grid);
  for (const d of weekDates(state.monday, weeks)) {
    const isToday = +d === +t;
    if (isClosed(d)) { grid.append(el('div', { class: 'card daycard' }, el('h3', {}, `${DAY[d.getDay()]} ${fmt(d)} · Closed`))); continue; }
    const day = cycleDay(d); if (!day) continue;
    grid.append(el('div', { class: 'card daycard' + (isToday ? ' today' : '') },
      el('h3', {}, `${DAY[d.getDay()]} ${fmt(d)}`, isToday ? el('span', { class: 'chip' }, 'Today') : null),
      MEALS.map(meal => {
        const it = day.meals[meal] || {};
        const names = GROUPS.map(([c]) => it[c]).filter(Boolean).map(n => n + (n === it.bread && it.wg ? ' ★' : ''));
        const inf = state.infants && day.infant && day.infant[meal] ? GROUPS.map(([c]) => day.infant[meal][c]).filter(Boolean) : [];
        return el('div', { class: 'meal' }, el('b', {}, meal), names.join(', '),
          it.extras ? el('div', { class: 'days' }, 'Extras: ' + it.extras.map(([x]) => x).join(', ')) : null,
          inf.length ? el('div', { class: 'days' }, 'Infants: ' + inf.join(', ')) : null);
      })));
  }
  parts.push(el('p', { class: 'note' }, `Menu updated ${isoLabel(DATA.updated)}. Months not made yet show the usual cycle; closures show once they're entered.`));
  parts.push(el('button', { class: 'opt', onclick: showQr }, 'Show QR code for this page'));
  return parts;
}

function showQr() {
  const box = el('div', { id: 'qr' });
  openSheet('Scan to open this page',
    el('p', { class: 'note' }, 'Anyone who scans this can open the list and menu.'), box);
  const draw = () => new QRCode(box, { text: location.origin + location.pathname + '#k=' + load('key', ''), width: 240, height: 240 });
  if (window.QRCode) return draw();
  const s = document.createElement('script');
  s.src = 'qrcode.min.js';  // shipped with the page (shop_page.SITE_FILES), so it works offline
  s.onload = draw; s.onerror = () => box.replaceChildren('Could not draw the QR code here.');
  document.head.append(s);
}

// No key: e.g. an iPhone home-screen icon, which keeps its own storage apart
// from Safari's. Pasting the full link once saves the key for this copy.
function askForLink() {
  const input = el('input', { type: 'text', class: 'field', inputmode: 'url', autocapitalize: 'off', placeholder: 'https://…/shop-list/#k=…', autocomplete: 'off' });
  const msg = el('p', { class: 'note' });
  const go = ev => {
    ev.preventDefault();
    const k = /[#&]k=([A-Za-z0-9_-]+)/.exec(input.value.trim());
    if (!k) { msg.textContent = 'That doesn\'t look like the full link - it should end with #k= and a long code.'; return; }
    store('key', k[1]); location.hash = 'k=' + k[1]; location.reload();
  };
  document.getElementById('app').replaceChildren(el('form', { onsubmit: go },
    el('p', {}, 'Paste the shopping list link you were sent (the whole thing). This only needs doing once.'),
    input, msg, el('button', { class: 'opt primary', type: 'submit' }, 'Open')));
}

// Swipe left/right on the list or menu for the next/previous week.
function swipeWeeks(area) {
  let from = null;
  area.addEventListener('touchstart', ev => {
    from = ev.touches.length === 1 ? { x: ev.touches[0].clientX, y: ev.touches[0].clientY } : null;
  }, { passive: true });
  area.addEventListener('touchend', ev => {
    if (!from) return;
    const dx = ev.changedTouches[0].clientX - from.x, dy = ev.changedTouches[0].clientY - from.y;
    from = null;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 40) { state.monday = addDays(state.monday, dx < 0 ? 7 : -7); render(); }
  }, { passive: true });
}

// The Menu tab opens at today's card when today is in the week shown.
function scrollToToday() {
  const card = document.querySelector('.daycard.today');
  if (card) window.scrollTo({ top: card.getBoundingClientRect().top + scrollY - document.querySelector('header').offsetHeight - 8 });
}

// Ticks and "seen" lists for weeks more than 8 weeks back, and the old
// Infants button's setting (now showInfants), are no use any more.
function tidyStorage() {
  try {
    const cutoff = ymd(addDays(today(), -56));
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const m = /^(ticks|seen):(\d{4}-\d{2}-\d{2})/.exec(localStorage.key(i) || '');
      if (m && m[2] < cutoff) localStorage.removeItem(localStorage.key(i));
    }
    localStorage.removeItem('infants');
  } catch (e) {}
}

// ---------- start ----------
async function start() {
  const m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash);
  if (m) store('key', m[1]);
  const key = m ? m[1] : load('key', '');
  const app = document.getElementById('app');
  if (!key) { askForLink(); return; }
  try {
    const res = await fetch('menu.enc', { cache: 'no-cache' });
    state.offline = res.headers.get('X-Shop-Saved') === '1' || navigator.onLine === false;
    DATA = await decrypt(await res.json(), b64(key));
  } catch (e) {
    const badKey = e.message === 'key';
    app.replaceChildren(el('p', { class: 'empty' }, badKey
      ? 'This link\'s key doesn\'t match. Open the newest link you were sent.' : 'Could not load the list. Check the connection and try again.'),
      badKey ? el('button', { class: 'opt primary', onclick: askForLink }, 'Paste the newest link')
        : el('button', { class: 'opt primary', onclick: () => { app.replaceChildren(el('p', { class: 'empty' }, 'Loading…')); start(); } }, 'Try again'));
    return;
  }
  document.body.classList.add('ready');
  tidyStorage();
  state.twoWeeks = load('twoWeeks', false); state.infants = load(SAVED_AS.infants, true); state.sinkTicked = load('sinkTicked', false);
  state.compact = load('compact', false);
  state.groupBy = VIEWS.some(([v]) => v === load('groupBy')) ? load('groupBy') : 'type';
  state.monday = defaultMonday(today());
  document.getElementById('prev').onclick = () => { state.monday = addDays(state.monday, -7); render(); };
  document.getElementById('next').onclick = () => { state.monday = addDays(state.monday, 7); render(); };
  document.getElementById('tab-list').onclick = () => { state.tab = 'list'; render(); };
  document.getElementById('tab-menu').onclick = () => { state.tab = 'menu'; render(); scrollToToday(); };
  document.getElementById('title').onclick = () => {
    if (+state.monday !== +defaultMonday(today())) { state.monday = defaultMonday(today()); render(); }
  };
  swipeWeeks(document.getElementById('app'));
  document.getElementById('settings').onclick = openSettings;
  document.getElementById('sheet').onclick = ev => { if (ev.target.id === 'sheet') closeSheet(); };
  document.onkeydown = ev => { if (ev.key === 'Escape') closeSheet(); };
  render();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
start();
</script>
